[project]
name = "mcp-abaqus"
version = "0.1.0"
description = "MCP server for driving local Abaqus jobs and reading ODB results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mcp>=2.3.0,<3",
]

[project.scripts]
mcp-abaqus = "mcp_abaqus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_abaqus"]

[tool.uv]
package = true
